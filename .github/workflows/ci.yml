name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android compile and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Firebase emulator tooling
        run: npm install --no-save firebase-tools
      - name: Generate ephemeral debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Compile debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify Firebase resources were generated and packaged
        run: |
          set -euo pipefail
          GENERATED="app/build/generated/res/google-services/debug/values/values.xml"
          test -f "$GENERATED"
          grep -q 'gen-lang-client-0207053136' "$GENERATED"
          grep -q '1:863997008927:android:87c2ce91560390f176892a' "$GENERATED"
          echo "Firebase generated resources verified for project gen-lang-client-0207053136."
          echo "Locating the real APK (AGP may place a redirect file at the conventional output path)..."
          find app/build -name '*.apk' -print
          APK=""
          while IFS= read -r candidate; do
            if unzip -t "$candidate" >/dev/null 2>&1; then
              APK="$candidate"
              break
            fi
          done < <(find app/build -name '*.apk' -print)
          if [ -z "$APK" ]; then
            echo "No valid APK archive was found. APK-like build outputs:"
            find app/build -name '*.apk' -exec sh -c 'echo "--- $1"; file "$1"; head -c 200 "$1" || true; echo' _ {} \;
            exit 1
          fi
          echo "Verified real APK archive: $APK"
          unzip -p "$APK" resources.arsc > app/build/packaged-resources.arsc
          test -s app/build/packaged-resources.arsc
          cp "$APK" app/build/verified-debug.apk
          echo "Real APK verified and copied to app/build/verified-debug.apk."
      - name: Run unit tests with Firebase Auth and Firestore emulators
        run: npx firebase-tools emulators:exec --only firestore,auth --project demo-no-project "gradle --no-daemon testDebugUnitTest --stacktrace"
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltc-debug-apk-firebase-config-check
          path: app/build/verified-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  firestore-rules:
    name: Firestore security rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install rules-test dependencies
        run: npm install --no-save firebase @firebase/rules-unit-testing firebase-tools
      - name: Run Firestore emulator tests
        run: npx firebase-tools emulators:exec --only firestore --project demo-no-project "node --test firestore.test.js"
