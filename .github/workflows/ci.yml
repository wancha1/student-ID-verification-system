name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**", "release/**", "security/**", "integration/**"]
  pull_request:
    branches: [main, "fix/**", "feat/**", "release/**", "security/**", "integration/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android compile and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Validate Supabase real-token test script syntax
        run: bash -n scripts/supabase-real-token-smoke.sh
      - name: Generate ephemeral debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Generate ephemeral CI-only release keystore
        env:
          STORE_PASSWORD: ci-only-store-password
          KEY_PASSWORD: ci-only-store-password
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release-ci.keystore" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=CI Only,O=Non-Production,C=UG"
      - name: Compile debug and release APK variants
        env:
          STORE_PASSWORD: ci-only-store-password
          KEY_PASSWORD: ci-only-store-password
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/release-ci.keystore" \
            STORE_PASSWORD="$STORE_PASSWORD" \
            KEY_PASSWORD="$STORE_PASSWORD" \
            gradle --no-daemon --no-build-cache assembleDebug assembleRelease
      - name: Prefetch Robolectric Android 14 runtime
        shell: bash
        run: |
          set -euo pipefail
          version="14-robolectric-10818077-i7"
          artifact="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$version/android-all-instrumented-$version.jar"
          mkdir -p "$(dirname "$artifact")"
          if [ ! -s "$artifact" ]; then
            relative="org/robolectric/android-all-instrumented/$version/android-all-instrumented-$version.jar"
            downloaded=false
            for mirror in \
              "https://maven-central.storage-download.googleapis.com/maven2" \
              "https://repo.maven.apache.org/maven2" \
              "https://repo1.maven.org/maven2"; do
              if curl --fail --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 2 "$mirror/$relative" -o "$artifact"; then
                downloaded=true
                break
              fi
            done
            test "$downloaded" = true
          fi
          test -s "$artifact"
      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace
      - name: Run device smoke tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # This runner has no KVM; Android Emulator otherwise exits before opening ADB.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          # API 34 keeps the CI smoke test on a stable, widely supported image.
          api-level: 34
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          # Avoid runner-side settings writes that caused ADB broken-pipe failures.
          disable-animations: false
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Upload debug APK
        # Preserve the compiled APK even if the emulator smoke test fails.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltc-debug-apk-ci-build-not-release
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  supabase-migration-replay:
    name: Replay canonical Supabase migrations from empty database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Generate local Supabase configuration
        run: supabase init --force
      - name: Avoid shared-runner PostgreSQL port collisions
        run: |
          sed -i '/^\[db\]/,/^\[/{s/^port = 54322$/port = 54342/; s/^shadow_port = 54320$/shadow_port = 54340/;}' supabase/config.toml
          grep -A8 '^\[db\]' supabase/config.toml
      - name: Start disposable local Supabase stack
        run: supabase start
      - name: Replay every canonical migration from an empty database
        run: supabase db reset --local
      - name: Stop disposable local Supabase stack
        if: always()
        run: supabase stop --no-backup

  database-migrations:
    name: PostgreSQL migration integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scholink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scholink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare synthetic Supabase-compatible schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d scholink_test -v ON_ERROR_STOP=1 -f scripts/db-test/bootstrap.sql
      - name: Verify the LTC school seed is idempotent
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d scholink_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261127150000_seed_ltc_school.sql
          psql -h localhost -U postgres -d scholink_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261127150000_seed_ltc_school.sql
          test "$(psql -h localhost -U postgres -d scholink_test -tAc "SELECT count(*) FROM public.schools WHERE id='ltc_school_01'")" = "1"
      - name: Apply issuer lifecycle audit migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d scholink_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261126144609_trusted_issuer_lifecycle_audit.sql
      - name: Apply student school-change guard migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d scholink_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261126144613_block_unapproved_student_school_changes.sql
      - name: Apply V1 role-boundary hardening migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d scholink_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261126190000_scholink_v1_role_boundary_hardening.sql
      - name: Apply append-only Gate and Meal sync migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d scholink_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261127090000_scholink_append_only_event_sync.sql
      - name: Apply meal and academic audit migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d scholink_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261127120000_scholink_meal_and_academic_audit.sql
      - name: Verify migration behaviour and privileges
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d scholink_test -v ON_ERROR_STOP=1 -f scripts/db-test/assertions.sql


  supabase-authenticated-role-tests:
    name: Authenticated Supabase role-boundary tests (staging)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run role tests when isolated staging secrets are configured
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TEST_SCHOOL_ID: ${{ secrets.TEST_SCHOOL_ID }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_HEAD_TEACHER_EMAIL: ${{ secrets.TEST_HEAD_TEACHER_EMAIL }}
          TEST_HEAD_TEACHER_PASSWORD: ${{ secrets.TEST_HEAD_TEACHER_PASSWORD }}
          TEST_GATE_OFFICER_EMAIL: ${{ secrets.TEST_GATE_OFFICER_EMAIL }}
          TEST_GATE_OFFICER_PASSWORD: ${{ secrets.TEST_GATE_OFFICER_PASSWORD }}
          TEST_MEAL_STAFF_EMAIL: ${{ secrets.TEST_MEAL_STAFF_EMAIL }}
          TEST_MEAL_STAFF_PASSWORD: ${{ secrets.TEST_MEAL_STAFF_PASSWORD }}
          TEST_SENTINEL_STUDENT_ID: ${{ secrets.TEST_SENTINEL_STUDENT_ID }}
          TEST_SENTINEL_GATE_LOG_ID: ${{ secrets.TEST_SENTINEL_GATE_LOG_ID }}
          TEST_SENTINEL_MEAL_ID: ${{ secrets.TEST_SENTINEL_MEAL_ID }}
          TEST_SENTINEL_ATTENDANCE_EVENT_ID: ${{ secrets.TEST_SENTINEL_ATTENDANCE_EVENT_ID }}
          TEST_SENTINEL_EXAM_EVENT_ID: ${{ secrets.TEST_SENTINEL_EXAM_EVENT_ID }}
        run: |
          if [[ -n "${SUPABASE_URL:-}" && -n "${SUPABASE_PUBLISHABLE_KEY:-}" && -n "${TEST_SCHOOL_ID:-}" \
            && -n "${TEST_ADMIN_EMAIL:-}" && -n "${TEST_ADMIN_PASSWORD:-}" \
            && -n "${TEST_HEAD_TEACHER_EMAIL:-}" && -n "${TEST_HEAD_TEACHER_PASSWORD:-}" \
            && -n "${TEST_GATE_OFFICER_EMAIL:-}" && -n "${TEST_GATE_OFFICER_PASSWORD:-}" \
            && -n "${TEST_MEAL_STAFF_EMAIL:-}" && -n "${TEST_MEAL_STAFF_PASSWORD:-}" \
            && -n "${TEST_SENTINEL_STUDENT_ID:-}" && -n "${TEST_SENTINEL_GATE_LOG_ID:-}" \
            && -n "${TEST_SENTINEL_MEAL_ID:-}" && -n "${TEST_SENTINEL_ATTENDANCE_EVENT_ID:-}" \
            && -n "${TEST_SENTINEL_EXAM_EVENT_ID:-}" ]]; then
            bash scripts/supabase-real-token-smoke.sh
          else
            echo "::error::Release gate blocked: configure isolated staging Auth users and sentinel record IDs as repository secrets. Role-boundary tests must not silently skip."
            exit 1
          fi
