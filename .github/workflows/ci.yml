name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**", "release/**"]
  pull_request:
    branches: [main, "fix/**", "feat/**", "release/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android compile and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Generate ephemeral debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Generate ephemeral CI-only release keystore
        env:
          STORE_PASSWORD: ci-only-store-password
          KEY_PASSWORD: ci-only-store-password
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release-ci.keystore" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=CI Only,O=Non-Production,C=UG"
      - name: Compile debug and release APK variants
        env:
          STORE_PASSWORD: ci-only-store-password
          KEY_PASSWORD: ci-only-store-password
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/release-ci.keystore" \
            STORE_PASSWORD="$STORE_PASSWORD" \
            KEY_PASSWORD="$STORE_PASSWORD" \
            gradle --no-daemon --no-build-cache assembleDebug assembleRelease
      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace
      - name: Run device smoke tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 keeps the CI smoke test on a stable, widely supported image.
          api-level: 34
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          # Avoid runner-side settings writes that caused ADB broken-pipe failures.
          disable-animations: false
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Upload debug APK
        # Preserve the compiled APK even if the emulator smoke test fails.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltc-debug-apk-ci-build-not-release
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

