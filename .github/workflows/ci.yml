name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**", "release/**"]
  pull_request:
    branches: [main, "fix/**", "feat/**", "release/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supabase-migration-replay:
    name: Replay canonical Supabase migrations from empty database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Generate local Supabase configuration
        run: supabase init --force
      - name: Start disposable local Supabase stack
        run: supabase start
      - name: Replay every canonical migration from an empty database
        run: supabase db reset --local
      - name: Stop disposable local Supabase stack
        if: always()
        run: supabase stop --no-backup
