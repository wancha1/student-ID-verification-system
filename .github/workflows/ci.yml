name: CI

on:
  push:
    branches: [main, "fix/**", "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep only the newest verification run for each branch/PR ref so stale builds
# do not hold runners while newer fixes wait in the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android debug/release builds and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Restore Firebase Android configuration from repository secret
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_GOOGLE_SERVICES_JSON}" ]]; then
            echo "::error::Configure the FIREBASE_GOOGLE_SERVICES_JSON Actions secret with the LTC app's google-services.json contents."
            exit 1
          fi
          printf '%s' "${FIREBASE_GOOGLE_SERVICES_JSON}" > app/google-services.json
          node -e '
            const c = require("./app/google-services.json");
            const client = (c.client || []).find(x => x.client_info?.android_client_info?.package_name === "com.aistudio.studentaccess.xpkz");
            if (c.project_info?.project_id !== "gen-lang-client-0207053136" ||
                client?.client_info?.mobilesdk_app_id !== "1:863997008927:android:87c2ce91560390f176892a") {
              throw new Error("Firebase config does not match the authorized LTC Android app.");
            }
          '
      - name: Install Firebase emulator tooling
        run: npm install --no-save firebase-tools
      - name: Generate ephemeral debug and release signing keys for CI only
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkeypair -v \
            -keystore ci-release.keystore \
            -storepass android \
            -keypass android \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CI Release Validation,O=Android,C=US"
      - name: Compile debug and release APKs
        id: build
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-release.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Verify Firebase resources were generated and packaged
        run: |
          set -euo pipefail
          GENERATED="app/build/generated/res/google-services/debug/values/values.xml"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          EXPECTED_PROJECT_ID='gen-lang-client-0207053136'
          EXPECTED_APP_ID='1:863997008927:android:87c2ce91560390f176892a'
          test -f "$GENERATED"
          grep -F "$EXPECTED_PROJECT_ID" "$GENERATED" >/dev/null
          grep -F "$EXPECTED_APP_ID" "$GENERATED" >/dev/null
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          # Inspect the compiled resource table with the Android SDK's aapt2 binary.
          # apkanalyzer is not guaranteed to be on PATH on hosted runners.
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          if [[ -z "$AAPT2" || ! -x "$AAPT2" ]]; then
            echo "::error::Could not locate Android SDK build-tools aapt2."
            exit 1
          fi
          for APK in "$DEBUG_APK" "$RELEASE_APK"; do
            if ! "$AAPT2" dump resources --values "$APK" | grep -F "$EXPECTED_APP_ID" >/dev/null; then
              echo "::error::Authorized google_app_id was not found in packaged resources for $APK."
              "$AAPT2" dump resources --values "$APK" | grep -E 'google_app_id|project_id' || true
              exit 1
            fi
          done
          echo "Authorized Firebase app ID is generated and packaged in both APKs."
      - name: Run unit tests with Firebase Auth and Firestore emulators
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: npx firebase-tools emulators:exec --only firestore,auth --project demo-no-project "gradle --no-daemon testDebugUnitTest --stacktrace"
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltc-debug-apk-ci-validation-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  firestore-rules:
    name: Firestore security rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install rules-test dependencies
        run: npm install --no-save firebase @firebase/rules-unit-testing firebase-tools
      - name: Run Firestore emulator tests
        run: npx firebase-tools emulators:exec --only firestore --project demo-no-project "node --test firestore.test.js"
