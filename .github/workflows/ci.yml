name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android compile and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Firebase emulator tooling
        run: npm install --no-save firebase-tools
      - name: Generate ephemeral debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Generate ephemeral CI-only release keystore
        env:
          STORE_PASSWORD: ci-only-store-password
          KEY_PASSWORD: ci-only-store-password
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release-ci.keystore" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=CI Only,O=Non-Production,C=UG"
      - name: Compile debug and release APK variants
        env:
          STORE_PASSWORD: ci-only-store-password
          KEY_PASSWORD: ci-only-store-password
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/release-ci.keystore" \
            STORE_PASSWORD="$STORE_PASSWORD" \
            KEY_PASSWORD="$STORE_PASSWORD" \
            gradle --no-daemon assembleDebug assembleRelease
      - name: Verify Firebase resources were generated and packaged in both variants
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT" || { echo "Android aapt tool not found under $SDK_ROOT/build-tools" >&2; exit 1; }

          for VARIANT in debug release; do
            GENERATED="app/build/generated/res/google-services/$VARIANT/values/values.xml"
            APK="app/build/outputs/apk/$VARIANT/app-$VARIANT.apk"
            test -f "$GENERATED" || { echo "Missing generated Firebase resources: $GENERATED" >&2; find app/build/generated/res/google-services -maxdepth 5 -type f -print 2>/dev/null || true; exit 1; }
            test -f "$APK" || { echo "Missing APK: $APK" >&2; exit 1; }

            for EXPECTED in 'gen-lang-client-0207053136' '1:863997008927:android:87c2ce91560390f176892a'; do
              if ! grep -Fq "$EXPECTED" "$GENERATED"; then
                echo "Expected Firebase value missing from generated $VARIANT resources: $EXPECTED" >&2
                cat "$GENERATED" >&2
                exit 1
              fi
            done

            RESOURCE_DUMP="$(mktemp)"
            "$AAPT" dump --values resources "$APK" > "$RESOURCE_DUMP"
            for EXPECTED in 'gen-lang-client-0207053136' '1:863997008927:android:87c2ce91560390f176892a'; do
              if ! grep -Fq "$EXPECTED" "$RESOURCE_DUMP"; then
                echo "Expected Firebase value missing from compiled $VARIANT APK resources: $EXPECTED" >&2
                grep -n -E 'google_app_id|project_id|google_api_key|Firebase' "$RESOURCE_DUMP" | head -80 >&2 || true
                rm -f "$RESOURCE_DUMP"
                exit 1
              fi
            done
            rm -f "$RESOURCE_DUMP"
            echo "Verified expected Firebase project/app IDs in generated resources and compiled $VARIANT APK."
          done
      - name: Run unit tests with Firebase Auth and Firestore emulators
        run: npx firebase-tools emulators:exec --only firestore,auth --project demo-no-project "gradle --no-daemon testDebugUnitTest --stacktrace"
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltc-debug-apk-firebase-config-check
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  firestore-rules:
    name: Firestore security rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install rules-test dependencies
        run: npm install --no-save firebase @firebase/rules-unit-testing firebase-tools
      - name: Run Firestore emulator tests
        run: npx firebase-tools emulators:exec --only firestore --project demo-no-project "node --test firestore.test.js"
